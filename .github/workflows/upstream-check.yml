name: Check React Learn index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

concurrency:
  group: upstream-check-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          set +e
          node bin/react-docs-ebook.js check-updates --source github --ref main --refresh 2>&1 | tee upstream-report.txt
          status="${PIPESTATUS[0]}"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update tracking issue
        if: steps.check.outputs.status == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat upstream-report.txt)"
          issue="$(gh issue list --state open --search 'React Learn index changed in:title' --json number --jq '.[0].number')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Automated check found the following current differences:\n\n\`\`\`text\n${body}\n\`\`\`"
          else
            gh issue create --title "React Learn index changed" --body "The declarative book manifest needs review:\n\n\`\`\`text\n${body}\n\`\`\`"
          fi
          exit 1
      - name: Close resolved tracking issue
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search 'React Learn index changed in:title' --json number --jq '.[].number' |
            while read -r issue; do
              gh issue close "$issue" --comment "The manifest matches the current upstream Learn index."
            done
      - name: Report checker failure
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '2'
        run: |
          cat upstream-report.txt
          exit 1
